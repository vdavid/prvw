windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_ColorSystem",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# `sysconf(_SC_PAGESIZE)`, to turn `/proc/self/statm` pages into bytes.
libc = "0.2"
# The file picker's Linux backend: the XDG desktop portal, which works under Flatpak and
# Snap and needs no toolkit. The Wayland default feature is deliberately left off — it only
# supplies a parent-window handle, and it would pull `libwayland-client` back in.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Only the macOS updater speaks HTTPS. Scoping `reqwest` here keeps `aws-lc-sys` (and its
# NASM build requirement) out of the Windows and Linux targets entirely.
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSBezierPath",
  "NSBitmapImageRep",
  "NSButton",
  "NSButtonCell",
  "NSCell",
  "NSClickGestureRecognizer",
  "NSCollectionView",
  "NSCollectionViewFlowLayout",
  "NSCollectionViewLayout",
  "NSColor",
  "NSControl",
  "NSCursor",
  "NSEvent",
  "NSFont",
  "NSGestureRecognizer",
  "NSGlassEffectView",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSImageView",
  "NSLayoutConstraint",
  "NSOutlineView",
  "NSParagraphStyle",
  "NSPasteboard",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSPrintPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSScrollView",
  "NSSlider",
  "NSSplitView",
  "NSStackView",
  "NSSwitch",
  "NSTableColumn",
  "NSTableView",
  "NSText",
  "NSTextField",
  "NSTrackingArea",
  "NSUserInterfaceLayout",
  "NSView",
  "NSViewController",
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = [
  "NSAppleEventDescriptor",
  "NSAppleEventManager",
  "NSArray",
  "NSBundle",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSIndexPath",
  "NSSet",
  "NSString",
  "NSURL",
  "objc2-core-services",
] }
objc2-core-foundation = { version = "0.3", features = [
  "CFString",
  "CFDictionary",
  "CFNumber",
  "CFURL",
  "CFArray",
  "CFData",
] }
objc2-core-services = { version = "0.3", features = ["LSInfo"] }
objc2-core-graphics = { version = "0.3", features = [
  "CGImage",
  "CGColorSpace",
  "CGContext",
  "CGDataProvider",
  "CGGeometry",
] }
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = [
  "std",
  "QLThumbnailGenerator",
  "QLThumbnailGenerationRequest",
  "QLThumbnailRepresentation",
  "QLThumbnailErrors",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }
objc2-image-io = { version = "0.3", default-features = false, features = [
  "std",
  "CGImageSource",
  "CGImageProperties",
  "objc2",
  "objc2-core-graphics",
] }
block2 = "0.6"

# NOTE: dev-profile opt-level overrides for zune-jpeg and moxcms live in the
# workspace-root Cargo.toml — Cargo ignores `[profile.*]` in member manifests.

[build-dependencies]
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.27.0"
little_exif = "0.6.23"
# The E2E harness talks plain HTTP to `127.0.0.1` (`qa/server.rs`), so it needs no TLS
# provider. Keeping it TLS-free is what lets non-macOS targets skip `aws-lc-sys`.
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json"] }
