[package]
name = "prvw"
version = "0.15.1"
edition = "2024"
description = "A fast, minimal image viewer for macOS"
license = "BUSL-1.1"

[dependencies]
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "0.4.0"
image = "0.25.10"
zune-jpeg = "0.5.15"
zune-core = "0.5.1"
moxcms = { version = "0.9.0", features = ["in_place"] }
rayon = "1.11.0"
log = "0.4.29"
env_logger = "0.11.10"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
bytemuck_derive = "1.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.23.1"
nom-exif = { version = "3.6.2", default-features = false }
rawler = "0.7.2"
multiversion = "0.8.0"
lensfun = { git = "https://github.com/vdavid/lensfun-rs", rev = "ae65ed6" }
zstd = "0.13.3"
glyphon = "0.12.0"
half = "2.7"
alphanumeric-sort = "1.5.6"
notify = "8.2.0"
# The native "Open an image" picker behind File → Open. MIT. Default features are
# `xdg-portal` + `wayland`, both Linux-only; `gtk3` is opt-in in 0.17, so the GTK chain M0
# step 8 removed can't come back through here. Linux adds `xdg-portal` below, which is the
# only backend it needs and whose one dependency (`pollster`) we already have.
rfd = { version = "0.17.2", default-features = false }

# The native menu bar and the right-click context menu. macOS and Windows only: muda's Linux
# backend is GTK (nine C dependencies, and an `apt-get` in CI), and its menu bar can't attach to
# a winit window there anyway, since it only offers `init_for_gtk_window`. `src/menu/absent.rs` is the
# Linux side of that. `default-features = false` drops `gtk` and `libxdo`, which muda pulls in
# for Linux and BSD alone, so they leave `Cargo.lock` entirely.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.19.3", default-features = false }

