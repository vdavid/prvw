# Standalone, kept out of the app's workspace so a benchmark run never rebuilds the app.
[workspace]

[package]
name = "jpeg-decode-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
zune-jpeg = { version = "0.5", features = ["x86", "neon", "std"] }
zune-core = "0.5"
turbojpeg = "1.5"
rand = "0.10"
