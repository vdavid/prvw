# cargo-deny: what third-party code may enter the workspace (`apps/desktop`, `xtask`), by license,
# by source, and by version shape. The `cargo-deny` check runs `cargo deny check bans licenses sources`
# (`scripts/check/checks/desktop-rust-cargo-deny.go`), and CI gates on it. `docs/security.md` has the
# wider picture. The standalone `benchmarks/*` crates have their own lockfiles, never ship, and
# aren't covered.
#
# Advisories are deliberately not checked here. `cargo-audit` owns them (accepted list in
# `desktop-rust-cargo-audit.go`) and runs daily in `advisories.yml`, because the RustSec database
# changes under an untouched lockfile. Everything below is a pure function of `Cargo.lock` and this
# file, so it can gate every push without a fresh advisory turning unrelated work red. Keeping the
# two in separate tools keeps that line sharp: the gating lane never fetches the advisory database,
# and cargo-audit keeps its fail-on-vulnerability, warn-on-unmaintained split, which cargo-deny
# would flatten into errors.

[graph]
# Every platform Prvw builds for. Without this list cargo-deny resolves the graph for the host
# only, so a Windows- or Linux-only dependency (which ships just the same) would never be looked at.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[licenses]
# Prvw is BSL-1.1 and ships a binary with every dependency statically linked into it, so the bar is
# "can we ship this inside a source-available binary without its terms reaching our own code".
# Permissive licenses pass; copyleft doesn't, except where an exception below says why it's fine.
# An `OR` expression passes when any one side is on the list (`self_cell` is `Apache-2.0 OR
# GPL-2.0-only`, and we take the Apache side).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  # Apache-2.0 plus a permission that waives the attribution requirement for compiled output.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  # Unicode's data license: permissive, attribution only (`icu_*`, `zerovec`, `unicode-ident`).
  "Unicode-3.0",
  # Public-domain dedications.
  "CC0-1.0",
  "Unlicense",
]
# A crate whose license is detected from file contents rather than declared must match its
# canonical text closely, or it counts as unlicensed.
confidence-threshold = 0.93
exceptions = [
  # Our own crates. They're never published, and Prvw's own license is the one everything above
  # is measured against.
  { crate = "prvw", allow = ["BUSL-1.1"] },
  { crate = "xtask", allow = ["BUSL-1.1"] },
  # The RAW decoder. LGPL is accepted because Prvw's source is public, which is what lets a user
  # rebuild the binary against a modified `rawler` (LGPL-2.1 section 6), the obligation static
  # linking puts on us. `docs/notes/lensfun-rs.md` § License records the reasoning. The
  # identifier comes from the clarification below.
  { crate = "rawler", allow = ["LGPL-2.1-only"] },
  # Lens correction, David's own port of LensFun, which keeps upstream's license. Same reasoning
  # as `rawler`. Its bundled lens database is
  # CC-BY-SA-3.0 and compiled into the binary; that isn't in the crate's license field, so
  # cargo-deny can't see it, and attribution is on us.
  { crate = "lensfun", allow = ["LGPL-3.0-or-later"] },
]

# A clarification states a crate's license where its manifest doesn't say it cleanly. Each pins the
# license file's hash (cargo-deny's xxHash32), so a release that changes the file stops matching and
# the crate is judged from scratch again.

# The manifest has `license-file = "LICENSE"` and no expression. The file is the MIT text.
[[licenses.clarify]]
crate = "nom-exif"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xc4978e87 }]

# The manifest says `LGPL-2.1`, an identifier SPDX deprecated because it doesn't say whether later
# versions apply. It reads as `-only`, the stricter of the two.
[[licenses.clarify]]
crate = "rawler"
expression = "LGPL-2.1-only"
license-files = [{ path = "LICENSE", hash = 0xb0aff759 }]

[bans]
# A `*` requirement lets any future release in, which is the hole the three-day window closes.
# Path dependencies inside the workspace are exempt.
wildcards = "deny"
allow-wildcard-paths = true
# Two versions of one crate cost build time and binary size. Every duplicate we have today waits on
# an upstream release, so each is listed in `skip` below, and anything else fails. That makes the
# list the complete set of known duplicates, and keeps the check silent while nothing changes.
#
# A new duplicate (usually a Renovate bump) fails CI rather than warning. A warning would either sit
# yellow forever or get ignored, and either way nobody decides anything. The fix is cheap and has
# to be a decision: converge it with `cargo update -p <crate>@<old> --precise <ver>` if any
# dependent's range allows it, or add a `skip` naming who pulls the old version.
#
# The reverse holds too: the check runs with `-D unmatched-skip -D unnecessary-skip`
# (`desktop-rust-cargo-deny.go`), so once upstream converges, the stale entry fails until it's
# deleted. cargo-deny only warns about those by default, and the toml can't raise them.
#
# Dev-only duplicates don't count (`multiple-versions-include-dev` defaults to false): they never
# ship.
multiple-versions = "deny"
highlight = "all"
# Each entry is the OLD version, as a semver-compatible range (`crate:1` means `^1`), so a patch
# release of the old line doesn't need an edit. The comment names what still pulls it in.
skip = [
  # winit 0.30 and its Wayland stack (calloop 0.13, smithay-client-toolkit 0.19), the last stable
  # winit; 0.31 is still in beta.
  { crate = "bitflags:1", reason = "winit 0.30 via core-graphics 0.23" },
  { crate = "block2:0.5", reason = "winit 0.30" },
  { crate = "core-foundation:0.9", reason = "winit 0.30 via core-graphics 0.23" },
  { crate = "objc2:0.5", reason = "winit 0.30" },
  { crate = "objc2-app-kit:0.2", reason = "winit 0.30" },
  { crate = "objc2-foundation:0.2", reason = "winit 0.30" },
  { crate = "smol_str:0.2", reason = "winit 0.30" },
  { crate = "getrandom:0.3", reason = "winit 0.30 via ahash, and image via rav1e" },
  { crate = "rustix:0.38", reason = "winit 0.30's Wayland stack (calloop 0.13, smithay-client-toolkit 0.19)" },
  { crate = "linux-raw-sys:0.4", reason = "winit 0.30's Wayland stack via rustix 0.38" },
  { crate = "thiserror:1", reason = "winit 0.30 via calloop 0.13, ndk 0.9, and smithay-client-toolkit 0.19" },
  { crate = "thiserror-impl:1", reason = "winit 0.30 via thiserror 1" },
  { crate = "windows-sys:0.52", reason = "winit 0.30" },
  { crate = "windows-sys:0.59", reason = "winit 0.30's Wayland stack via rustix 0.38" },
  { crate = "windows-targets:0.52", reason = "winit 0.30 via windows-sys 0.52 and 0.59" },
  { crate = "windows_aarch64_msvc:0.52", reason = "winit 0.30 via windows-targets 0.52" },
  { crate = "windows_x86_64_gnu:0.52", reason = "winit 0.30 via windows-targets 0.52" },
  { crate = "windows_x86_64_msvc:0.52", reason = "winit 0.30 via windows-targets 0.52" },
  # notify 8 (the newest stable; 9 is a release candidate).
  { crate = "windows-sys:0.60", reason = "notify 8" },
  # Linux only, through reqwest's native-tls: openssl still uses the old pair.
  { crate = "foreign-types:0.3", reason = "openssl via reqwest's native-tls (Linux)" },
  { crate = "foreign-types-shared:0.1", reason = "openssl via reqwest's native-tls (Linux)" },
  # The rest are one dependency each, already on its newest release.
  { crate = "hashbrown:0.16", reason = "gpu-allocator 0.28 (wgpu-hal, Windows) and libflate_lz77 (rawler)" },
  { crate = "miniz_oxide:0.8", reason = "png, exr (both via image), and backtrace (rawler); flate2 has moved to 0.9" },
  { crate = "moxcms:0.8", reason = "image 0.25; Prvw itself is on 0.9" },
  { crate = "multiversion:0.8", reason = "rawler; Prvw itself is on 0.9" },
  { crate = "multiversion-macros:0.8", reason = "rawler via multiversion 0.8" },
  { crate = "nom:7", reason = "nom-exif via iso6709parse 0.1" },
  { crate = "pollster:0.4", reason = "rfd; Prvw itself is on 1.0" },
  { crate = "quick-xml:0.41", reason = "winit 0.30's Wayland stack via wayland-scanner; plist is on 0.42" },
  { crate = "rustc-hash:1", reason = "naga and wgpu-core 30" },
  { crate = "syn:2", reason = "about 20 proc-macro crates that haven't moved to syn 3" },
  { crate = "toml_datetime:0.6", reason = "rawler via toml 0.8" },
  { crate = "toml_edit:0.22", reason = "rawler via toml 0.8" },
  { crate = "winnow:0.7", reason = "rawler via toml 0.8" },
]

[sources]
# Everything comes from crates.io. A git dependency or another registry skips the publish record,
# the yank mechanism, and the three-day window, so it has to be added here on purpose.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
