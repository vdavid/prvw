name: CI

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all checks (bypass change detection)'
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main
jobs:
  # ===========================================
  # Determine which jobs to run based on changed files
  # ===========================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      website: ${{ steps.filter.outputs.website }}
      scripts: ${{ steps.filter.outputs.scripts }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Detect file changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            rust:
              - 'apps/desktop/**'
            website:
              - 'apps/website/**'
              - 'pnpm-lock.yaml'
            scripts:
              - 'scripts/**'
            changelog:
              - 'CHANGELOG.md'
              - 'scripts/check/checks/changelog-commit-links.go'

  # ===========================================
  # Desktop app - Rust
  # ===========================================
  desktop-rust:
    name: Desktop (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: inputs.run_all || needs.changes.outputs.rust == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install tools with mise
        run: mise install

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The test check falls back to `cargo install cargo-nextest --locked` when the binary is
      # missing, which builds it from source and costs minutes on every run. The prebuilt binary
      # takes seconds. `latest` is deliberate: it's a test runner, not something we ship.
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/0.9.143/linux | tar zxf - -C "$HOME/.cargo/bin"

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Check rustfmt
        run: ./scripts/check/check --check rustfmt --ci

      - name: Run clippy
        run: ./scripts/check/check --check clippy --ci

      - name: Run Rust tests
        run: ./scripts/check/check --check cargo-test --ci

  # ===========================================
  # Desktop app - macOS
  # ===========================================
  desktop-rust-macos:
    name: Desktop (Rust, macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    needs: changes
    if: inputs.run_all || needs.changes.outputs.rust == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install tools with mise
        run: mise install

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Prebuilt binary, for the same reason as the Linux job.
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/0.9.143/mac | tar zxf - -C "$HOME/.cargo/bin"

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      # No separate `cargo build` step and no rustfmt: clippy runs `--all-targets`, the test
      # run builds the binary the E2E tests spawn, and rustfmt is platform-independent, so the
      # Linux job already covers it.
      - name: Run clippy
        run: ./scripts/check/check --check clippy --ci

      # macOS is the only platform that runs `tests/integration.rs`: the 60 E2E tests spawn a
      # real window and wgpu surface, so they're `#![cfg(target_os = "macos")]` and headless
      # Linux skips them entirely.
      - name: Run Rust tests
        run: ./scripts/check/check --check cargo-test --ci

  # ===========================================
  # Desktop app - Windows
  # ===========================================
  desktop-rust-windows:
    name: Desktop (Rust, Windows)
    runs-on: windows-latest
    # Windows builds this crate roughly twice as slowly as the other two runners, and
    # clippy and the test run don't share artifacts, so the budget is the loosest here.
    timeout-minutes: 60
    needs: changes
    if: inputs.run_all || needs.changes.outputs.rust == 'true'

    # Spelled out rather than relying on the runner default, since every command below is
    # PowerShell rather than the bash the rest of this file assumes.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install tools with mise
        run: mise install

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Prebuilt binary, for the same reason as the Linux job. Windows ships it as a zip
      # instead of a tarball, and `~/.cargo/bin` is already on the runner's PATH.
      - name: Install cargo-nextest
        run: |
          Invoke-WebRequest -Uri https://get.nexte.st/0.9.143/windows -OutFile nextest.zip
          Expand-Archive -Path nextest.zip -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force
          Remove-Item nextest.zip

      # `-o check.exe`, not `-o check`: `go build` writes exactly the name it's given, and
      # PowerShell won't run an extensionless file.
      - name: Build check tool
        run: go build -o check.exe .
        working-directory: ./scripts/check

      # Same two steps as the macOS job, for the same reasons: clippy runs `--all-targets`,
      # and the test run links `prvw.exe` (cargo builds bin targets alongside the integration
      # test), so a separate `cargo build` would add a third compile for no new signal.
      # rustfmt is platform-independent and stays on the Linux job.
      - name: Run clippy
        run: ./scripts/check/check.exe --check clippy --ci

      # Windows runs the unit tests only. The 60 E2E tests in `tests/integration.rs` are
      # `#![cfg(target_os = "macos")]`, so the file compiles to nothing here.
      - name: Run Rust tests
        run: ./scripts/check/check.exe --check cargo-test --ci

  # ===========================================
  # Website
  # ===========================================
  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: inputs.run_all || needs.changes.outputs.website == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install tools with mise
        run: mise install

      - name: Cache pnpm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        # --ignore-scripts: recent pnpm (10.16+, 11.x) turns un-approved dependency
        # build scripts into a hard install error (ERR_PNPM_IGNORED_BUILDS). esbuild
        # and sharp ship prebuilt binaries and don't need their postinstall scripts
        # for the Astro build, so we skip them. See apps/website/CLAUDE.md.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Run oxfmt
        run: ./scripts/check/check --check oxfmt --ci

      - name: Run ESLint
        run: ./scripts/check/check --check website-eslint --ci

      - name: Run typecheck
        run: ./scripts/check/check --check website-typecheck --ci

      - name: Build website
        run: ./scripts/check/check --check website-build --ci

  # ===========================================
  # Scripts (Go checks)
  # ===========================================
  scripts:
    name: Scripts (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: inputs.run_all || needs.changes.outputs.scripts == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install tools with mise
        run: mise install

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Check gofmt
        run: ./scripts/check/check --check gofmt --ci

      - name: Run go vet
        run: ./scripts/check/check --check go-vet --ci

      - name: Run staticcheck
        run: ./scripts/check/check --check staticcheck --ci

      - name: Run misspell
        run: ./scripts/check/check --check misspell --ci

      - name: Run gocyclo
        run: ./scripts/check/check --check gocyclo --ci

      - name: Run deadcode
        run: ./scripts/check/check --check deadcode --ci

      - name: Run Go tests
        run: ./scripts/check/check --check go-tests --ci

  # ===========================================
  # CHANGELOG commit links
  # ===========================================
  changelog:
    name: CHANGELOG commit links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: inputs.run_all || needs.changes.outputs.changelog == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install tools with mise
        run: mise install

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Validate CHANGELOG commit links
        run: ./scripts/check/check --check changelog-links --ci

  # ===========================================
  # Website deployment
  # ===========================================
  deploy-website:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: website
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Trigger deploy webhook
        run: |
          PAYLOAD='{}'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" | cut -d' ' -f2)

          curl -f -X POST https://getprvw.com/hooks/deploy-website \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"

  # ===========================================
  # Summary job for branch protection
  # ===========================================
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [desktop-rust, desktop-rust-macos, desktop-rust-windows, website, scripts, changelog]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Some jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs were cancelled"
            exit 1
          fi
          echo "All jobs passed or were skipped"
