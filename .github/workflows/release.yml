name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Two runners can build this: GitHub's hosted macOS images, and David's self-hosted M3 MBP
    # (`[self-hosted, macOS, ARM64]`). GitHub-hosted is the ACTIVE one; the repo is public, so
    # hosted macOS minutes are free. Switching back is this one line, plus re-enabling the runner
    # service on the Mac.
    runs-on: macos-latest
    # Generous because most of it is Apple's, not ours: the staple step below retries for up to
    # two hours waiting on Apple's CDN. A hosted runner also pays a cold cargo compile every run
    # (the self-hosted runner's warm cache made that part near-free), but the three arch jobs run
    # in PARALLEL on hosted rather than queueing on one machine.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: universal-apple-darwin
            arch: universal

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install tools with mise
        run: mise install

      - name: Install create-dmg
        run: command -v create-dmg || brew install create-dmg

      - name: Install x86_64 Rust target
        if: matrix.arch != 'aarch64'
        run: rustup target add x86_64-apple-darwin

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          # Add the temp keychain to the search list WITHOUT removing the login keychain
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

      - name: Set up notarization credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode \
            > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build aarch64
        if: matrix.arch == 'aarch64'
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        if: matrix.arch == 'x86_64'
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build universal (both architectures + lipo)
        if: matrix.arch == 'universal'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/prvw \
            target/x86_64-apple-darwin/release/prvw \
            -output target/universal-apple-darwin/release/prvw

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create .app bundle
        run: |
          BINARY="target/${{ matrix.target }}/release/prvw"
          APP_BUNDLE="target/${{ matrix.target }}/release/Prvw.app"
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          cp "$BINARY" "$APP_BUNDLE/Contents/MacOS/prvw"
          chmod +x "$APP_BUNDLE/Contents/MacOS/prvw"
          sed "s/__VERSION__/$VERSION/g" apps/desktop/Info.plist > "$APP_BUNDLE/Contents/Info.plist"
          cp apps/desktop/resources/AppIcon.icns "$APP_BUNDLE/Contents/Resources/AppIcon.icns"

      - name: Sign .app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_BUNDLE="target/${{ matrix.target }}/release/Prvw.app"
          codesign \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --identifier "com.veszelovszki.prvw" \
            --options runtime \
            --entitlements apps/desktop/Entitlements.plist \
            --force \
            --verbose \
            --deep \
            "$APP_BUNDLE"
          codesign --verify --verbose=2 "$APP_BUNDLE"

      - name: Create DMG
        run: |
          ./scripts/create-dmg.sh \
            "target/${{ matrix.target }}/release/Prvw.app" \
            "Prvw_${{ steps.version.outputs.version }}_${{ matrix.arch }}.dmg"

      - name: Notarize DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit \
            "Prvw_${{ steps.version.outputs.version }}_${{ matrix.arch }}.dmg" \
            --key ~/private_keys/AuthKey_${APPLE_API_KEY}.p8 \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

      - name: Staple notarization ticket
        run: |
          DMG="Prvw_${{ steps.version.outputs.version }}_${{ matrix.arch }}.dmg"
          MAX_ATTEMPTS=240  # 240 x 30s = 2 hours
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Staple attempt $attempt/$MAX_ATTEMPTS..."
            if xcrun stapler staple "$DMG" 2>&1; then
              echo "Stapled successfully."
              exit 0
            fi
            echo "Apple CDN not ready yet, waiting 30 seconds..."
            sleep 30
          done
          echo "Stapling failed after $MAX_ATTEMPTS attempts (2 hours)."
          exit 1

      - name: Verify staple
        run: |
          xcrun stapler validate \
            "Prvw_${{ steps.version.outputs.version }}_${{ matrix.arch }}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg-${{ matrix.arch }}
          path: 'Prvw_${{ steps.version.outputs.version }}_${{ matrix.arch }}.dmg'

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          # Restore the login keychain to the search list. A no-op on a hosted runner (the whole
          # VM is discarded), but it MUST stay: the import step above replaces the search list,
          # and on the self-hosted Mac skipping this leaves the real login keychain out of it,
          # breaking `gh` and every other keychain-backed tool until the next login.
          security list-keychains -d user -s ~/Library/Keychains/login.keychain-db
          echo "Keychain search list restored:"
          security list-keychains -d user

  build-windows:
    name: Build (Windows installer)
    runs-on: windows-latest
    # A cold release compile dominates, and Windows is the slowest of the three runners at it.
    # NSIS's solid-LZMA pass over a 36 MB executable adds a couple of minutes after that. No
    # notarisation, so nothing here waits on a third party the way the macOS legs do.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # No mise: this leg needs cargo (rustup ships with the image) and makensis, and neither
      # comes from mise. Go, node, and pnpm would only be dead weight here.
      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Windows Server 2022 shipped NSIS preinstalled; the 2025 image behind `windows-latest`
      # doesn't, so chocolatey supplies it. Pinned rather than floating, for the same reason
      # cargo-nextest is pinned in ci.yml: an NSIS release shouldn't change what a release build
      # means overnight. Bump it deliberately.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          # The package runs the real NSIS setup, which lands in Program Files and neither shims
          # `makensis` nor touches PATH, so the build step below wouldn't find it otherwise.
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build prvw.exe
        run: cargo build --release --target x86_64-pc-windows-msvc

      # Bash, because the script is: `windows-latest` carries Git Bash, and the script handles the
      # `/d/a/...` paths that shell speaks.
      #
      # SIGNING SEAM: `PRVW_WINDOWS_SIGN_CMD` is the whole of it. Unset, which is the case today,
      # the script signs nothing and the release carries an unsigned installer. Point the
      # `PRVW_WINDOWS_SIGN_CMD` repository variable at a sign-one-file command on the runner and
      # both `prvw.exe` and the finished installer go through it, with no other change here.
      # Azure Trusted Signing will also want a step above this one to install its dispatcher and
      # hand it credentials. See docs/guides/releasing.md.
      - name: Build the installer
        shell: bash
        env:
          PRVW_WINDOWS_SIGN_CMD: ${{ vars.PRVW_WINDOWS_SIGN_CMD }}
        run: ./scripts/build-windows-installer.sh --exe target/x86_64-pc-windows-msvc/release/prvw.exe

      # The installer's version comes from `apps/desktop/Cargo.toml`, the tag from git. `release.sh`
      # writes both, so a mismatch means someone tagged by hand, and the release job would go
      # looking for a file that isn't there. Say so here instead.
      - name: Verify the installer matches the tag
        shell: bash
        run: |
          INSTALLER="target/windows-installer/PrvwSetup-${{ steps.version.outputs.version }}-x64.exe"
          if [[ ! -f "$INSTALLER" ]]; then
            echo "No $INSTALLER. The version in apps/desktop/Cargo.toml doesn't match tag $GITHUB_REF_NAME:"
            ls -l target/windows-installer/
            exit 1
          fi
          echo "Built $INSTALLER"

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: 'target/windows-installer/PrvwSetup-${{ steps.version.outputs.version }}-x64.exe'

  release:
    name: Create release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Every artifact this run produced: the three DMGs and the Windows installer, flattened into
      # one directory.
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: ./artifacts

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '1d;$d' | sed '/./,$!d')
          printf '%s\n' "$NOTES" > /tmp/notes.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Prvw $GITHUB_REF_NAME" \
            --notes-file /tmp/notes.txt \
            ./artifacts/*.dmg \
            ./artifacts/*.exe

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"

          # DMG sizes in bytes (formatted to MB at runtime by the website)
          SIZE_AARCH64=$(stat -c%s "./artifacts/Prvw_${VERSION}_aarch64.dmg")
          SIZE_X86_64=$(stat -c%s "./artifacts/Prvw_${VERSION}_x86_64.dmg")
          SIZE_UNIVERSAL=$(stat -c%s "./artifacts/Prvw_${VERSION}_universal.dmg")
          # The Windows installer's size rides inside its own platform entry. `dmgSizes` is what
          # the website reads today and it holds DMGs, so a Windows number has no place in it.
          SIZE_WINDOWS=$(stat -c%s "./artifacts/PrvwSetup-${VERSION}-x64.exe")

          jq -n --indent 2 \
            --arg version "$VERSION" \
            --argjson size_aarch64 "$SIZE_AARCH64" \
            --argjson size_x86_64 "$SIZE_X86_64" \
            --argjson size_universal "$SIZE_UNIVERSAL" \
            --argjson size_windows "$SIZE_WINDOWS" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base_url "$BASE_URL" \
            '{
              version: $version,
              dmgSizes: { aarch64: $size_aarch64, x86_64: $size_x86_64, universal: $size_universal },
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: "\($base_url)/Prvw_\($version)_aarch64.dmg" },
                "darwin-x86_64": { url: "\($base_url)/Prvw_\($version)_x86_64.dmg" },
                "darwin-universal": { url: "\($base_url)/Prvw_\($version)_universal.dmg" },
                "windows-x86_64": {
                  url: "\($base_url)/PrvwSetup-\($version)-x64.exe",
                  size: $size_windows
                }
              }
            }' > /tmp/latest.json

      - name: Commit latest.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          cp /tmp/latest.json apps/website/public/latest.json
          git add apps/website/public/latest.json
          git commit -m "Release: update latest.json for ${{ github.ref_name }} [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Trigger website deploy
        run: |
          PAYLOAD='{}'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" | cut -d' ' -f2)

          curl -f -X POST https://getprvw.com/hooks/deploy-website \
              -H "Content-Type: application/json" \
              -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
              -d "$PAYLOAD"
