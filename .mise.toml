[tools]
go = "1.27"
node = "26"
# `npm:pnpm` backend, not the default `aqua:pnpm/pnpm`: pnpm switched their
# GitHub release assets from `pnpm-linux-x64.tar.gz` archives to raw binaries
# (`pnpm-linux-x64`), which the aqua resolver can't find. The npm registry
# stays consistent.
#
# Pin the exact version, kept in sync with `packageManager` in the root
# `package.json` (and the `npm install --global pnpm` in `apps/website/Dockerfile`). A
# floating `"12"` would drift to a newer 12.x than `packageManager`, and pnpm
# refuses to run when its version doesn't match that field. Bump all three
# together.
"npm:pnpm" = "12.11.2"
# Rust is managed by rustup via rust-toolchain.toml
