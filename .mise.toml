[tools]
go = "1.27.2"
node = "26"
# The default `aqua:pnpm/pnpm` backend, which downloads pnpm 12's native binary
# from the GitHub release. Not `npm:pnpm`: pnpm 12's npm package ships a
# placeholder `pnpm` that its postinstall swaps for the native binary, and
# mise's npm backend doesn't run that postinstall, so node chokes on the
# placeholder with a SyntaxError.
#
# Pin the exact version, kept in sync with `packageManager` in the root
# `package.json` (and the `npm install --global pnpm` in `apps/website/Dockerfile`). A
# floating `"12"` would drift to a newer 12.x than `packageManager`, and pnpm
# refuses to run when its version doesn't match that field. Bump all three
# together.
pnpm = "12.11.2"
# Rust is managed by rustup via rust-toolchain.toml
